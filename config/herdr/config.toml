onboarding = false

[theme]
name = "tokyo-night"

[terminal]
default_shell = "/opt/homebrew/bin/zsh"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "backtick"
detach = "prefix+shift+p"


rename_pane = "prefix+comma"
reload_config = "prefix+shift+r"

switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

close_pane = ""

[[keys.command]]
key = "prefix+x"
type = "popup"
command = '''/opt/homebrew/bin/zsh -fc 'printf "\n  Close current pane?\n\n  [y] Close   [any key] Cancel\n"; read -sk 1 answer; [[ "$answer" == [yY] ]] && "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID" >/dev/null' '''
description = "close pane with confirmation"
width = 46
height = 8


[ui]
redraw_on_focus_gained = false

agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

# 单 Tab 时减少一行 UI 占用
hide_tab_bar_when_single_tab = true

confirm_close = true

[worktrees]
directory = "~/Documents/worktrees"

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "pi"]

# 防止把可能包含 token、命令输出的终端内容写进持久化历史
pane_history = false
